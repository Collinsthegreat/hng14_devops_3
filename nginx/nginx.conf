user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Trust Docker internal network for X-Forwarded-For
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # JSON access log format
    log_format json_combined escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/hng-access.log json_combined;

    sendfile on;
    keepalive_timeout 65;

    upstream nextcloud {
        server nextcloud:80;
    }

    # ── Dashboard subdomain block (FIRST — takes priority for exact server_name match) ──
    server {
        listen 80;
        server_name dashboard.doflamingo.mooo.com;

        location / {
            proxy_pass http://18.207.70.89:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Main server block: IP-only — /dashboard → detector, everything else → Nextcloud ──
    server {
        listen 80;
        server_name 18.207.70.89;

        # Dashboard served by detector on port 8080
        location /dashboard {
            proxy_pass http://18.207.70.89:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other traffic goes to Nextcloud
        location / {
            proxy_pass http://nextcloud;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            client_max_body_size 512M;
        }
    }
}
